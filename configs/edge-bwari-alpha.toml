node_id = "tower-bwari-alpha"
publish_topic = "caesar_tactical_intel"
loop_count = 0
fusion_window_ms = 700
threat_threshold = 0.75
# Auto-generated identity key — no manual config needed.
key_file = "/etc/caesar/tower-bwari-alpha.key"

[location]
site = "Bwari-North-Ridge"
latitude = 9.2797
longitude = 7.3781

[uplink]
mode = "gossipsub"

[optical]
enabled = true
mode = "synthetic"
profile = "rpi_csi_jpeg"
camera_id = "alpha-optical-front"
width = 1280
height = 720
frame_interval_ms = 500

[thermal]
enabled = true
mode = "synthetic"
camera_id = "alpha-thermal-front"
width = 640
height = 512
frame_interval_ms = 350

[radar]
enabled = true
mode = "synthetic"
radar_id = "alpha-mmwave-front"
point_count = 48
frame_interval_ms = 325

[inference]
mode = "ort_native"
