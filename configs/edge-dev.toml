node_id = "tower-bwari-alpha"
publish_topic = "caesar_tactical_intel"
loop_count = 0
fusion_window_ms = 600
threat_threshold = 0.72
ed25519_seed_hex = "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
recon_enabled = true

[location]
site = "Bwari"
latitude = 9.2797
longitude = 7.3781

[uplink]
mode = "tcp_jsonl"
tcp_addr = "127.0.0.1:7878"

[optical]
enabled = true
mode = "synthetic"
profile = "rpi_csi_jpeg"
camera_id = "optical-front"
width = 1280
height = 720
frame_interval_ms = 500

[thermal]
enabled = true
mode = "synthetic"
camera_id = "thermal-front"
width = 640
height = 512
frame_interval_ms = 350

[radar]
enabled = true
mode = "synthetic"
radar_id = "mmwave-front"
point_count = 48
frame_interval_ms = 325

[inference]
# ort_native: tries ONNX first, falls back to Ollama VLM, then heuristic
mode = "ort_native"
model_yolo_world = "models/yolo_world_v2_l.onnx"
model_gemini_er  = "models/gemini_robotics_er.onnx"
model_seq2seq    = "models/seq2seq_thermal_lstm.onnx"
model_pxadmm     = "models/pxadmm_anomaly_tracker.onnx"
vocabulary       = [
  "human intruder", "armed person", "civilian drone", "military drone",
  "tractor", "truck", "motorcycle", "car", "animal",
  "fire", "smoke", "explosion", "weapon", "backpack",
  "person running", "person crouching", "crowd", "vehicle convoy"
]
ollama_endpoint  = "http://localhost:11434"
ollama_model     = "llava"
