node_id          = "tower-bwari-alpha"
publish_topic    = "caesar_tactical_intel"
loop_count       = 0
fusion_window_ms = 600
threat_threshold = 0.72
# SECURITY: No manual key management needed.
# On first boot this node auto-generates a unique Ed25519 keypair using OS entropy
# and writes it to key_file (created with permissions 0600 on Linux).
# Copy the logged public key fingerprint into hub-dev.toml trusted_public_keys.
key_file         = "./keys/tower-bwari-alpha-dev.key"
recon_enabled    = true
# Project Caesar deployment domain: "agricultural" | "industrial" | "tactical" | "general"
# Controls Ollama prompt style, actuator action mapping, and dashboard log prefixes.
domain           = "tactical"

[location]
site      = "Bwari"
latitude  = 9.2797
longitude = 7.3781

[uplink]
mode     = "tcp_jsonl"
tcp_addr = "127.0.0.1:7878"

[optical]
enabled          = true
mode             = "synthetic"
profile          = "rpi_csi_jpeg"
camera_id        = "optical-front"
width            = 1280
height           = 720
frame_interval_ms = 500

[thermal]
enabled          = true
mode             = "synthetic"
camera_id        = "thermal-front"
width            = 640
height           = 512
frame_interval_ms = 350

[radar]
enabled          = true
mode             = "synthetic"
radar_id         = "mmwave-front"
point_count      = 48
frame_interval_ms = 325

[inference]
# ort_native: tries ONNX first, falls back to Ollama VLM, then heuristic
mode = "ort_native"
model_yolo_world = "models/yolo_world_v2_s.onnx"
model_gemini_er  = "models/gemini_robotics_er_1_6.onnx"
model_seq2seq    = "models/seq2seq_thermal_lstm.onnx"
model_pxadmm     = "models/pxadmm_anomaly.onnx"
vocabulary       = [
  "human intruder", "armed person", "civilian drone", "military drone",
  "tractor", "truck", "motorcycle", "car", "animal",
  "fire", "smoke", "explosion", "weapon", "backpack",
  "person running", "person crouching", "crowd", "vehicle convoy",
  "knife", "blade"
]
ollama_endpoint  = "http://localhost:11434"
ollama_model     = "llava"

# ---------------------------------------------------------------------------
# OpenCV Sentinel Pipeline
# ---------------------------------------------------------------------------
# Set enabled = true when a real camera is attached (device_id = VideoCapture index).
# When enabled, the standard optical worker is bypassed entirely — the sentinel
# owns the camera and only wakes the AI after confirmed change.
[sentinel]
enabled              = false        # flip to true with a real camera
device_id            = 0
fps                  = 24
motion_area_threshold = 500.0       # minimum contour area in px² to register motion
anomaly_threshold    = 0.30         # accumulate snapshots above this score
burst_threshold      = 0.70         # skip accumulation, escalate AI immediately above this
min_snapshots        = 8            # portraits need this many confirmed frames
autonomous_confidence = 0.87        # actuator fires only above this mean confidence
# snapshot_dir       = "data/snapshots"   # uncomment to persist crops across reboots
# mjpeg_port         = 8090              # uncomment to serve live MJPEG on this port

# ---------------------------------------------------------------------------
# Pluggable Actuators ("prayers")
# Each entry registers a device that can respond autonomously to AI detections.
# Add new entries here to plug in new effectors without touching Rust code.
# ---------------------------------------------------------------------------

# Dashboard notification actuator — always logs, feeds the operator view
[[actuators]]
id           = "dashboard_notify"
actuator_type = "log"
capabilities  = ["alert", "increase_flow", "decrease_flow", "stop_flow",
                 "maintenance_alert", "lock_perimeter", "shutdown_zone"]

# Example: GPIO relay (Pi/Jetson — uncomment for tactical/industrial nodes)
# Fires when the AI detects an intruder, triggers the physical relay on pin 17.
# [[actuators]]
# id            = "perimeter_relay_north"
# actuator_type = "gpio"
# capabilities  = ["lock_perimeter", "alert"]
# gpio_pin      = 17

# Example: irrigation valve controller over UART (uncomment for farm deployments)
# [[actuators]]
# id            = "irrigation_zone_3"
# actuator_type = "serial"
# capabilities  = ["increase_flow", "decrease_flow", "stop_flow"]
# serial_port   = "/dev/ttyUSB0"
# baud_rate     = 9600

# Example: MQTT-based actuator (uncomment when an MQTT broker is available)
# [[actuators]]
# id            = "mqtt_command_bus"
# actuator_type = "mqtt"
# capabilities  = ["alert", "lock_perimeter", "maintenance_alert"]
# mqtt_topic    = "caesar/actions"
# mqtt_broker   = "localhost:1883"

# Example: HTTP Webhook actuator (POST JSON to any REST endpoint)
# Works with Telegram bots, Home Assistant, PagerDuty, Grafana OnCall,
# n8n automations, or any custom HTTP listener.
# [[actuators]]
# id                   = "webhook_alert"
# actuator_type        = "webhook"
# capabilities         = ["alert", "lock_perimeter", "maintenance_alert", "shutdown_zone"]
# webhook_url          = "http://192.168.1.50:8080/caesar-alert"
# # webhook_bearer_token = "your-secret-token"   # optional Authorization header
