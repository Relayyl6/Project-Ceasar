[workspace]
members = [
    "crates/uriel-caesar-core",
    "crates/uriel-edge-node",
    "crates/caesar-hub",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
tokio = { version = "1.35", features = ["full"] }
toml = "0.8"
libp2p = { version = "0.53", features = ["gossipsub", "mdns", "noise", "tcp", "yamux", "tokio", "macros"] }
url = "2.5"
snow = "0.9"
ort = { version = "2.0.0-rc.2" }
ndarray = "0.15"
opencv = { version = "0.93", default-features = false, features = ["videoio", "video", "imgproc", "imgcodecs"] }
mavlink = { version = "0.13", features = ["ardupilotmega"] }
zenoh = { version = "1.0", default-features = false, features = ["unstable"] }
